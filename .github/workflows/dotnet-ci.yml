name: .NET CI

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test

    runs-on: ubuntu-24.04

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ConferenceProFlow.slnx

      - name: Build solution
        run: dotnet build ConferenceProFlow.slnx --configuration Release --no-restore

      - name: Verify Docker availability
        run: docker info

      - name: Run automated tests
        run: dotnet test ConferenceProFlow.slnx --configuration Release --no-build --verbosity normal